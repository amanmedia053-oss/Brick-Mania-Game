name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create . --platforms=android --org com.brickmania.game --project-name brick_mania_game
      - name: Use reliable Gradle distribution endpoint
        run: |
          sed -i 's#https\\://services.gradle.org/distributions/#https\\://downloads.gradle.org/distributions/#' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/-all.zip/-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
      - name: Cache Gradle distributions and dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - name: Build release APK (retry transient download failures)
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "APK build attempt ${attempt}/6"
            if flutter build apk --release; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "A dependency server may be temporarily unavailable; waiting 45 seconds before retry..."
              sleep 45
            fi
          done
          exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brick-mania-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
